# E2E on every push/PR. Temporarily skipped; Vercel Git integration deploys pushes.
name: E2E

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Skip E2E temporarily
        run: echo "E2E is temporarily skipped."
